# The same config on upstream nginx, for comparison.  It does not start: stock
# nginx rejects the four-digit "return 6767" while reading the config and exits
# 1, so the container dies before it ever listens.  That failure is the point.
#
#   docker compose -f docker-compose.original.yml up -d
#   docker compose -f docker-compose.original.yml logs
#   -> [emerg] invalid return code "6767" in /etc/nginx/nginx.conf:13
#
# A separate project name and host port, so it can run alongside the fork.
name: nginx-original

services:
  nginx:
    image: nginx:stable
    # The official image's default command already passes "daemon off;", which
    # would collide with the same directive in our config.
    command: ["nginx"]
    ports:
      - "8068:67"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
